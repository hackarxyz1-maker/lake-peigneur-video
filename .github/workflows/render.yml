name: Lake Peigneur Video Render

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: false

      - name: Extract Project
        run: |
          unzip -q lake-peigneur-video.zip -d project

      - name: Install Dependencies
        working-directory: project
        run: npm ci

      - name: Setup Browser
        working-directory: project
        run: npx remotion browser ensure

      - name: Render 720p HD Video
        working-directory: project
        run: |
          mkdir -p out
          npx remotion render src/index.jsx LakeStory out/final.mp4 \
            --gl=angle \
            --concurrency=2 \
            --scale=0.666667 \
            --image-format=jpeg \
            --jpeg-quality=85 \
            --crf=23

      - name: Upload Final Video
        uses: actions/upload-artifact@v4
        with:
          name: Lake-Peigneur-720p-Final-Video
          path: project/out/final.mp4
          if-no-files-found: error
          retention-days: 7
